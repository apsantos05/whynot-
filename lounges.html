<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lounges · why not?</title>
  <meta name="description" content="Reserve seu lounge na why not? pelo mapa da The Week JK.">
  <meta property="og:title" content="Reserve seu lounge · why not?">
  <meta property="og:description" content="Escolha seu lounge no mapa e reserve pelo WhatsApp.">
  <meta property="og:image" content="assets/logo.jpg">
  <meta name="theme-color" content="#050404">
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=39">
</head>
<body class="page-lounges">
  <header class="lg-top">
    <a href="./" class="lg-top__mark" aria-label="why not? — voltar para o início">why not?</a>
    <a href="./" class="lg-top__link">Início</a>
  </header>

  <main class="lg">
    <div class="lg__intro">
      <h1 class="lg__title">Reserve seu lounge</h1>
      <p class="lg__lead">Toque no lounge que você quer no mapa da The Week JK. A conversa abre no WhatsApp com a mensagem pronta, e a gente te passa valores e disponibilidade.</p>

      <div class="lg__chips" role="group" aria-label="Lounges">
        <a class="lg-chip" data-espaco="Lounge 1">Lounge 1</a>
        <a class="lg-chip" data-espaco="Lounge 2">Lounge 2</a>
        <a class="lg-chip" data-espaco="Lounge 3">Lounge 3</a>
        <a class="lg-chip" data-espaco="Lounge 4">Lounge 4</a>
        <a class="lg-chip" data-espaco="Lounge 5">Lounge 5</a>
        <a class="lg-chip" data-espaco="Lounge 6">Lounge 6</a>
      </div>
    </div>

    <figure class="lg-map">
      <!-- planta da The Week JK redesenhada (sem escala); só os lounges são clicáveis -->
      <svg viewBox="0 0 560 1344" role="img" aria-labelledby="lg-map-title">
        <title id="lg-map-title">Mapa da The Week JK com os lounges 1 a 6</title>

        <!-- contexto (não clicável), nas medidas da planta enviada -->
        <g class="lg-ctx">
          <rect class="lg-ground" x="0" y="0" width="560" height="1344"/>

          <rect class="lg-road" x="0" y="52" width="560" height="100"/>
          <line class="lg-road__line" x1="0" y1="102" x2="560" y2="102"/>
          <text class="lg-label lg-label--road" x="280" y="107">Avenida JK</text>

          <rect class="lg-gate" x="262" y="152" width="62" height="94"/>
          <text class="lg-label lg-label--small" x="293" y="199" transform="rotate(-90 293 199)">Entrada</text>

          <rect class="lg-ext" x="0" y="249" width="560" height="135"/>
          <text class="lg-label" x="280" y="322">Área externa</text>

          <rect class="lg-in" x="0" y="384" width="560" height="817"/>
          <path class="lg-ext" d="M0 676 H363 V736 H560 V1201 H0 Z"/>
          <text class="lg-label" x="280" y="868">Área externa</text>

          <rect class="lg-room" x="359" y="386" width="201" height="272"/>
          <text class="lg-label" x="460" y="527">Cozinha</text>

          <rect class="lg-room" x="363" y="666" width="197" height="70"/>
          <text class="lg-label" x="461" y="706">Banheiros</text>

          <rect class="lg-stage" x="139" y="930" width="234" height="180" rx="6"/>
          <text class="lg-label lg-label--stage" x="256" y="1031">Palco</text>

          <line class="lg-door" x1="0" y1="1204" x2="560" y2="1204"/>
          <rect class="lg-out" x="0" y="1208" width="560" height="136"/>
          <text class="lg-label" x="86" y="1240">Entrada</text>
        </g>

        <!-- lounges (clicáveis) -->
        <g class="lg-spots">
          <a class="lg-spot" data-espaco="Lounge 1"><rect x="19" y="386" width="114" height="58"/><text x="76" y="426">1</text></a>
          <a class="lg-spot" data-espaco="Lounge 2"><rect x="19" y="444" width="114" height="58"/><text x="76" y="484">2</text></a>
          <a class="lg-spot" data-espaco="Lounge 3"><rect x="19" y="502" width="114" height="58"/><text x="76" y="542">3</text></a>
          <a class="lg-spot" data-espaco="Lounge 4"><rect x="19" y="560" width="114" height="58"/><text x="76" y="600">4</text></a>
          <a class="lg-spot" data-espaco="Lounge 5"><rect x="19" y="618" width="114" height="58"/><text x="76" y="658">5</text></a>
          <a class="lg-spot" data-espaco="Lounge 6"><circle cx="59" cy="726" r="40"/><text x="59" y="736">6</text></a>
        </g>
      </svg>
      <p class="lg-tip" id="lg-tip" aria-hidden="true"></p>
    </figure>
  </main>

  <footer class="foot">
    <a data-href="instagram" data-bind="instagramHandle"></a>
  </footer>

  <script src="config.js?v=39"></script>
  <script src="lounges.js?v=39"></script>
</body>
</html>
